<div>
  <h2>Todo List</h2>
  <ul>
    <li *ngFor="let todo of todos$ | async">
      <input
        type="checkbox"
        [checked]="todo.completed"
        (change)="toggle(todo)"
      />
      <span (click)="goDetail(todo.id)">{{ todo.name }}</span>
      <button (click)="remove(todo.id)">삭제</button>
    </li>
  </ul>
  <button (click)="goAdd()">todo 추가하기</button>
</div>
